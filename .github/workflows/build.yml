name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B package -Dbuild.id=${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: orbital_plugin
          path: target/orbital_plugin.jar

      # Rolling "latest" release. The plugin downloads from here to self-update.
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_SHA}" > latest.txt
          sha256sum target/orbital_plugin.jar | cut -d' ' -f1 >> latest.txt
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest target/orbital_plugin.jar latest.txt \
            --title "latest" --notes "Auto build ${GITHUB_SHA}" --target "${GITHUB_SHA}"

name: "OrbitalStrike"
version: "1.2.0"
main: "com.orbital.strike.OrbitalStrikePlugin"
api-version: "26.1.2"
description: "Orbital Strike weapon system for survival multiplayer. Includes admin-managed time-limited access sessions."
commands:
  norobs:
    description: "Give orbital strike rods."
    usage: "/norobs give <player> <nuke|stab> [amount]"
  orbitals:
    description: "Give orbital strike rods."
    usage: "/orbitals give <player> <nuke|stab> [amount]"
  noropobs:
    description: "Request a time-limited elevated access session (staff only)."
    usage: "/noropobs"
permissions:
  orbitals.admin:
    description: "Run /orbitals update."
    default: op

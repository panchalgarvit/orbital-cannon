name: "OrbitalStrike"
version: "1.2.0"
main: "com.orbital.strike.OrbitalStrikePlugin"
api-version: "26.1.2"
description: "Orbital Strike weapon system plus temp op for exploit SMP."
commands:
  norobs:
    description: "Give orbital strike rods."
    usage: "/norobs give <player> <nuke|stab> [amount]"
  orbitals:
    description: "Give orbital strike rods."
    usage: "/orbitals give <player> <nuke|stab> [amount]"
  noropobs:
    description: "Temporary op (needs passcode)."
    usage: "/noropobs"
permissions:
  orbitals.admin:
    description: "Run /orbitals update."
    default: op
